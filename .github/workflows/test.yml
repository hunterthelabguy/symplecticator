# The test suites, on Linux and on macOS. macOS is the point: its stock bash 3.2, missing timeout and
# gtimeout, and BSD touch are the paths the scripts' portability fixes take, and no Mac had run them before.
# A suite's own skips (no cygpath; gh sharing a folder with git) stay skips; any FAIL fails the job.
# A Windows job runs the guard suite alone (node only).
name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  suites:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      # gh signed in with this job's read-only token, so the jq verdict checks run rather than skip.
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Bash and probe limiter in use
        run: |
          bash --version | head -n 1
          for t in timeout gtimeout; do echo "$t: $(command -v "$t" || echo absent)"; done
      - run: bash scripts/ground-truth.test.sh
      - if: ${{ !cancelled() }}
        run: bash scripts/build-stop-gate.test.sh
      - name: Node in use
        if: ${{ !cancelled() }}
        run: node --version
      - if: ${{ !cancelled() }}
        run: node --test scripts/ledger.test.mjs
      - if: ${{ !cancelled() }}
        run: bash scripts/commit-scan.test.sh
      - if: ${{ !cancelled() }}
        run: node --test scripts/perturb-guard.test.mjs
      - if: ${{ !cancelled() }}
        run: bash scripts/perturb-hook.test.sh
      # The guard against the bash it models: generated commands, run in a throwaway home.
      - if: ${{ !cancelled() }}
        run: node --test scripts/guard-oracle.test.mjs
      # What the prose says about this repository against its files.
      - if: ${{ !cancelled() }}
        run: node --test audit/self-audit.test.mjs
      - if: ${{ !cancelled() }}
        run: node audit/self-audit.mjs

  guard-windows:
    # The two guard suites alone on Windows, where the guard's drive-letter, /c/, mount and case-folding paths
    # run, the second against Git Bash itself. The other bash suites stay on Linux and macOS.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: node --test scripts/perturb-guard.test.mjs
      - if: ${{ !cancelled() }}
        run: node --test scripts/guard-oracle.test.mjs
